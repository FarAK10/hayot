@if (!failed()) {
  @defer (on viewport) {
    <img [src]="'logos/' + logo()" [alt]="name()" (error)="onImageError()" />
  } @placeholder {
    <span class="tile" [style.background]="color()" aria-hidden="true">{{ initials() }}</span>
  }
} @else {
  <span class="tile" [style.background]="color()" aria-hidden="true">{{ initials() }}</span>
}
