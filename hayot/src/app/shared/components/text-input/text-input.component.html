@let error = this.error();
@let tokens = this.mask();
<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  @if (tokens) {
    <input
      matInput
      [formControl]="field"
      [appMask]="tokens"
      [errorStateMatcher]="errorStateMatcher"
      [attr.inputmode]="inputMode()"
      [placeholder]="placeholder()"
      (blur)="onBlur()"
    />
  } @else if (digitsOnly()) {
    <input
      matInput
      appDigitsOnly
      [formControl]="field"
      [errorStateMatcher]="errorStateMatcher"
      [attr.inputmode]="inputMode()"
      [placeholder]="placeholder()"
      (blur)="onBlur()"
    />
  } @else {
    <input
      matInput
      [formControl]="field"
      [errorStateMatcher]="errorStateMatcher"
      [attr.inputmode]="inputMode()"
      [placeholder]="placeholder()"
      (blur)="onBlur()"
    />
  }
  @if (error) {
    <mat-error>{{ error }}</mat-error>
  }
</mat-form-field>
