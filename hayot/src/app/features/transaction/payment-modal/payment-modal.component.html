@let name = this.name();
@let status = this.status();
<div class="modal">
  <header>
    <app-logo class="logo" [logo]="recipient.logo" [name]="name" [seed]="recipient.id" />
    <div class="titles">
      <h2 id="payment-title">{{ name }}</h2>
      <p>{{ fullName() }}</p>
    </div>
    <button mat-icon-button type="button" [attr.aria-label]="'close' | translate" (click)="close()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  @switch (status) {
    @case (PaymentStatus.Success) {
      <app-payment-success
        [recipientName]="name"
        [total]="total()"
        [transactionId]="transactionId()"
        (done)="close()"
      />
    }
    @case (PaymentStatus.Error) {
      <app-payment-error (retry)="retry()" (dismiss)="close()" />
    }
    @default {
      @if (hasFields) {
        <app-payment-form
          [dynamicForm]="dynamicForm"
          [fields]="fields"
          [rawValue]="rawValue()"
          [valid]="valid()"
          [recipient]="recipient"
          [amount]="amount()"
          [pending]="status === PaymentStatus.Pending"
          (submitted)="pay()"
        />
      } @else {
        <p class="empty">{{ 'noFields' | translate }}</p>
      }
    }
  }
</div>
