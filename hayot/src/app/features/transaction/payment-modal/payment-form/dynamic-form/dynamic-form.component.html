@for (field of renderedFields(); track field.key) {
  <div class="row">
    @switch (field.controlType) {
      @case (ControlType.Amount) {
        <app-amount-input
          [formControl]="field.control"
          [label]="field.label"
          [error]="field.error"
          [hint]="field.hint"
          [suffix]="field.suffix"
        />
      }
      @case (ControlType.Select) {
        <app-select-input
          [formControl]="field.control"
          [label]="field.label"
          [error]="field.error"
          [placeholder]="field.placeholder"
          [options]="field.options"
        />
      }
      @default {
        <app-text-input
          [formControl]="field.control"
          [label]="field.label"
          [error]="field.error"
          [placeholder]="field.placeholder"
          [mask]="field.tokens"
          [digitsOnly]="field.digitsOnly"
          [inputMode]="field.inputMode"
        />
      }
    }
  </div>
}
